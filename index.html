<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Textos con IA</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 { margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover { background-color: var(--primary-hover); }

        .result-box {
            width: 100%;
            height: 250px;
            margin-top: 15px;
            background: #f1f5f9;
            border: 1px dashed var(--border);
            padding: 15px;
            border-radius: 6px;
            box-sizing: border-box;
            font-weight: 500;
            text-transform: uppercase;
            overflow-y: auto;
            word-wrap: break-word;
        }

        .api-box {
            background: #fef08a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fef08a;
        }
    </style>
</head>
<body>

<div style="max-width: 1000px; width: 100%;">
    <center><h1>Redactor de Perfiles con IA</h1></center>
    
    <div class="card api-box">
        <label for="apiKey">🔑 Pega tu Gemini API Key aquí:</label>
        <input type="password" id="apiKey" placeholder="AIzaSy..." style="background: white;">
    </div>

    <div class="container">
        <div class="card">
            <h2>Datos del Solicitante</h2>
            <form id="dataForm" onsubmit="return false;">
                <div class="form-group">
                    <label>NOMBRE</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
                </div>
                
                <div class="grid-inputs">
                    <div class="form-group">
                        <label>EDAD</label>
                        <input type="number" id="edad" placeholder="Ej. 35">
                    </div>
                    <div class="form-group">
                        <label>ESTADO CIVIL</label>
                        <input type="text" id="estadoCivil" placeholder="Ej. Soltero">
                    </div>
                </div>

                <div class="form-group">
                    <label>UBICACIÓN DEL NEGOCIO</label>
                    <input type="text" id="ubicacion" placeholder="Ej. Guadalajara, Jalisco">
                </div>

                <div class="form-group">
                    <label>ACTIVIDAD / GIRO</label>
                    <input type="text" id="actividad" placeholder="Ej. Abarrotes y Comercio al por menor">
                </div>

                <div class="grid-inputs">
                    <div class="form-group">
                        <label>ANTIGÜEDAD NEGOCIO</label>
                        <input type="text" id="antiguedad" placeholder="Ej. 3 años">
                    </div>
                    <div class="form-group">
                        <label>EXPERIENCIA EN EL GIRO</label>
                        <input type="text" id="experiencia" placeholder="Ej. 5 años">
                    </div>
                </div>

                <div class="form-group">
                    <label>MONTO FINANCIAMIENTO</label>
                    <input type="text" id="monto" placeholder="Ej. $50,000 MXN">
                </div>

                <div class="form-group">
                    <label>FINANCIAMIENTO PARA (DESTINO)</label>
                    <textarea id="destino" rows="2" placeholder="Ej. Compra de mercancía y vitrina exhibidora"></textarea>
                </div>

                <button type="button" id="btnGenerar">Generar Texto con IA</button>
            </form>
        </div>

        <div class="card" style="display: flex; flex-direction: column;">
            <h2>Texto Generado</h2>
            <p style="font-size: 0.9rem; color: #64748b; margin: 0;">El resultado se generará automáticamente en un solo párrafo y en mayúsculas.</p>
            
            <div id="resultado" class="result-box">El texto aparecerá aquí...</div>
            
            <button id="btnCopiar" style="background-color: #10b981;">Copiar Texto</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('btnGenerar').addEventListener('click', async () => {
        const apiKey = document.getElementById('apiKey').value.trim();
        const btnGenerar = document.getElementById('btnGenerar');
        const resultadoDiv = document.getElementById('resultado');

        if (!apiKey) {
            alert('Por favor, ingresa tu API Key de Gemini arriba.');
            return;
        }

        // Campos a validar
        const campos = ['nombre', 'edad', 'estadoCivil', 'ubicacion', 'actividad', 'antiguedad', 'experiencia', 'monto', 'destino'];
        for (let id of campos) {
            if (!document.getElementById(id).value.trim()) {
                alert('Por favor, llena todos los campos del formulario.');
                return;
            }
        }

        const datos = {
            nombre: document.getElementById('nombre').value,
            edad: document.getElementById('edad').value,
            estadoCivil: document.getElementById('estadoCivil').value,
            ubicacion: document.getElementById('ubicacion').value,
            actividad: document.getElementById('actividad').value,
            antiguedad: document.getElementById('antiguedad').value,
            experiencia: document.getElementById('experiencia').value,
            monto: document.getElementById('monto').value,
            destino: document.getElementById('destino').value
        };

        btnGenerar.innerText = "Procesando con IA...";
        btnGenerar.disabled = true;
        resultadoDiv.innerText = "Redactando...";

        const prompt = `Actúa como un analista de crédito profesional. Con los siguientes datos, redacta un perfil ejecutivo del cliente. 
        REGLAS ESTRICTAS:
        1. Debe ser un SOLO PÁRRAFO continuo.
        2. Debe estar TODO EN MAYÚSCULAS.
        3. No uses viñetas, no uses saltos de línea ni negritas.
        
        Datos del cliente:
        - Nombre: ${datos.nombre}
        - Edad: ${datos.edad} años
        - Estado Civil: ${datos.estadoCivil}
        - Ubicación del Negocio: ${datos.ubicacion}
        - Actividad del Negocio: ${datos.actividad}
        - Antigüedad del Negocio: ${datos.antiguedad}
        - Experiencia en el giro: ${datos.experiencia}
        - Monto del Financiamiento solicitado: ${datos.monto}
        - Destino del Financiamiento: ${datos.destino}`;

        // Intentar con una petición directa HTTP a la API oficial (Evita el bloqueo de módulos)
        const modelos = ['gemini-2.5-flash', 'gemini-1.5-flash'];
        let exito = false;

        for (let mod of modelos) {
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${mod}:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const json = await response.json();
                
                if (json.candidates && json.candidates[0].content.parts[0].text) {
                    let textoFinal = json.candidates[0].content.parts[0].text.toUpperCase().trim();
                    resultadoDiv.innerText = textoFinal;
                    exito = true;
                    break;
                }
            } catch (err) {
                console.error("Error con modelo " + mod, err);
            }
        }

        if (!exito) {
            resultadoDiv.innerText = "ERROR AL COMUNICAR CON GEMINI. VERIFICA TU API KEY O INTENTA DE NUEVO MÁS TARDE.";
        }

        btnGenerar.innerText = "Generar Texto con IA";
        btnGenerar.disabled = false;
    });

    // Función del botón Copiar
    document.getElementById('btnCopiar').addEventListener('click', () => {
        const texto = document.getElementById('resultado').innerText;
        if(texto && !texto.includes("El texto aparecerá aquí") && !texto.includes("Redactando")) {
            navigator.clipboard.writeText(texto);
            alert("¡Texto copiado al portapapeles!");
        }
    });
</script>

</body>
</html>
