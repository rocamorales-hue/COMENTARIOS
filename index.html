<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Reestructuración de Créditos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        corporate: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#334e68',
                            600: '#243b53',
                            700: '#102a43',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 1000px; /* Arbitrary large height for smooth auto transition */
            opacity: 1;
        }
        .checkbox-custom:checked + label {
            text-decoration: line-through;
            color: #6b7280;
        }
        /* Custom Toast */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #102a43;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-12">

    <header class="bg-corporate-700 text-white shadow-md py-6 px-4 md:px-8">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Asistente de Reestructuraciones</h1>
                <p class="text-corporate-100 text-sm mt-1">Guía operativa y validación de expedientes</p>
            </div>
            <div class="text-right hidden sm:block">
                <span class="text-xs bg-corporate-600 px-3 py-1 rounded-full border border-corporate-500">
                    <i class="fas fa-calendar-alt mr-1"></i> Límite: Día 25 del mes
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        <!-- Progress Overview -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-lg font-semibold text-corporate-700">Progreso del Trámite</h2>
                <span id="progress-text" class="text-sm font-medium text-corporate-500">0% Completado</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div id="accordion-container" class="space-y-4">
            <!-- PASO 1 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <button class="accordion-header w-full flex justify-between items-center p-5 bg-gray-50 hover:bg-gray-100 transition-colors focus:outline-none" onclick="toggleAccordion('step1')">
                    <div class="flex items-center">
                        <span class="bg-corporate-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3">1</span>
                        <h3 class="text-lg font-semibold text-gray-800">Verificación Inicial y Desbloqueo</h3>
                    </div>
                    <i id="icon-step1" class="fas fa-chevron-down text-gray-400 transition-transform duration-300"></i>
                </button>
                <div id="step1" class="accordion-content">
                    <div class="p-5 border-t border-gray-200 space-y-3">
                        <div class="flex items-start">
                            <input type="checkbox" id="chk1-1" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk1-1" class="ml-3 block text-gray-700 cursor-pointer">Buscar el número de crédito del Formato de codificación en el sistema.</label>
                        </div>
                        <div class="flex items-start">
                            <input type="checkbox" id="chk1-2" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk1-2" class="ml-3 block text-gray-700 cursor-pointer">Si el crédito está bloqueado, solicitar desbloqueo a Ignacio.</label>
                        </div>
                        <div class="flex items-start">
                            <input type="checkbox" id="chk1-3" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk1-3" class="ml-3 block text-gray-700 cursor-pointer">Ingresar a pantalla <strong>Aplicar Pagos</strong> y confirmar Número de Crédito, Número de Persona y Nombre.</label>
                        </div>
                        <div class="flex items-start">
                            <input type="checkbox" id="chk1-4" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk1-4" class="ml-3 block text-gray-700 cursor-pointer">Verificar e ingresar fecha valor de la hoja (apartado IV).</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PASO 2 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <button class="accordion-header w-full flex justify-between items-center p-5 bg-gray-50 hover:bg-gray-100 transition-colors focus:outline-none" onclick="toggleAccordion('step2')">
                    <div class="flex items-center">
                        <span class="bg-corporate-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3">2</span>
                        <h3 class="text-lg font-semibold text-gray-800">Gestión de Saldos Guardados y Anticipo</h3>
                    </div>
                    <i id="icon-step2" class="fas fa-chevron-down text-gray-400 transition-transform duration-300"></i>
                </button>
                <div id="step2" class="accordion-content">
                    <div class="p-5 border-t border-gray-200 space-y-3">
                        <div class="flex items-start">
                            <input type="checkbox" id="chk2-1" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk2-1" class="ml-3 block text-gray-700 cursor-pointer">Consultar con Vianey/Teresita dinero a favor y anexar reporte Excel.</label>
                        </div>
                        <div class="flex items-start">
                            <input type="checkbox" id="chk2-2" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk2-2" class="ml-3 block text-gray-700 cursor-pointer">Corroborar aplicación de saldos o depósitos previos.</label>
                        </div>
                        <div class="bg-blue-50 p-4 rounded-lg mt-2 border border-blue-100">
                            <p class="text-sm font-semibold text-blue-800 mb-2">Si existe anticipo:</p>
                            <div class="space-y-2">
                                <div class="flex items-start">
                                    <input type="checkbox" id="chk2-3" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <label for="chk2-3" class="ml-3 block text-sm text-gray-700 cursor-pointer">Aplicar pago en <strong>MONTO DE PAGO</strong> (Concepto: Anticipo Reestructura).</label>
                                </div>
                                <div class="flex items-start">
                                    <input type="checkbox" id="chk2-4" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <label for="chk2-4" class="ml-3 block text-sm text-gray-700 cursor-pointer">Ingresar condonaciones en <strong>QUITA</strong> (Se va a Capital Vencido).</label>
                                </div>
                                <div class="flex items-start">
                                    <input type="checkbox" id="chk2-5" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <label for="chk2-5" class="ml-3 block text-sm text-gray-700 cursor-pointer">Imprimir el Recibo de Pago de Anticipo.</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PASO 3 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <button class="accordion-header w-full flex justify-between items-center p-5 bg-gray-50 hover:bg-gray-100 transition-colors focus:outline-none" onclick="toggleAccordion('step3')">
                    <div class="flex items-center">
                        <span class="bg-corporate-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3">3</span>
                        <h3 class="text-lg font-semibold text-gray-800">Liquidación y Reestructuración</h3>
                    </div>
                    <i id="icon-step3" class="fas fa-chevron-down text-gray-400 transition-transform duration-300"></i>
                </button>
                <div id="step3" class="accordion-content">
                    <div class="p-5 border-t border-gray-200">
                        
                        <!-- Calculator Tool -->
                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-5 mb-6 shadow-sm">
                            <h4 class="text-md font-semibold text-gray-800 mb-4 border-b pb-2"><i class="fas fa-calculator text-corporate-500 mr-2"></i>Calculadora de Monto Quita</h4>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Saldo Total ($)</label>
                                    <input type="number" id="calc-saldo" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0.00" oninput="calculateQuita()">
                                </div>
                                <div class="flex items-center justify-center text-gray-400 hidden md:flex pt-6">
                                    <i class="fas fa-minus"></i>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Monto a Reestructurar ($)</label>
                                    <input type="number" id="calc-reest" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0.00" oninput="calculateQuita()">
                                </div>
                                <div class="flex items-center justify-center text-gray-400 hidden md:flex pt-6">
                                    <i class="fas fa-equals"></i>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-800 mb-1">Monto Quita Resultante ($)</label>
                                    <input type="text" id="calc-result" class="w-full rounded-md border border-green-300 bg-green-50 px-3 py-2 font-bold text-green-800" placeholder="0.00" readonly>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <div class="flex items-start">
                                <input type="checkbox" id="chk3-1" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <label for="chk3-1" class="ml-3 block text-gray-700 cursor-pointer">Cargar nuevamente el número de crédito en <strong>Aplicar Pagos</strong>.</label>
                            </div>
                            <div class="flex items-start">
                                <input type="checkbox" id="chk3-2" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <label for="chk3-2" class="ml-3 block text-gray-700 cursor-pointer">Ingresar cifra de 'Monto Quita' en el sistema y 'Monto a Reestructurar' en Monto Pago.</label>
                            </div>
                            <div class="flex items-start">
                                <input type="checkbox" id="chk3-3" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <label for="chk3-3" class="ml-3 block text-gray-700 cursor-pointer">Forma de Pago: Seleccionar <strong>Liquidación - Reestructura</strong> y dar clic en Pagar.</label>
                            </div>
                            <div class="flex items-start">
                                <input type="checkbox" id="chk3-4" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <label for="chk3-4" class="ml-3 block text-gray-700 cursor-pointer">Imprimir el Recibo de Pago / Liquidación emitido.</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PASO 4 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <button class="accordion-header w-full flex justify-between items-center p-5 bg-gray-50 hover:bg-gray-100 transition-colors focus:outline-none" onclick="toggleAccordion('step4')">
                    <div class="flex items-center">
                        <span class="bg-corporate-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3">4</span>
                        <h3 class="text-lg font-semibold text-gray-800 text-left">Validación Anterior y Verificación del Nuevo</h3>
                    </div>
                    <i id="icon-step4" class="fas fa-chevron-down text-gray-400 transition-transform duration-300"></i>
                </button>
                <div id="step4" class="accordion-content">
                    <div class="p-5 border-t border-gray-200 space-y-3">
                        <div class="flex items-start">
                            <input type="checkbox" id="chk4-1" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk4-1" class="ml-3 block text-gray-700 cursor-pointer">Verificar estado anterior: Debe decir "Bloqueado por reestructurado" o "RESTRUCTURADO".</label>
                        </div>
                        <div class="flex items-start">
                            <input type="checkbox" id="chk4-2" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk4-2" class="ml-3 block text-gray-700 cursor-pointer">Cargar Nuevo Número de Crédito y revisar <strong>DATOS DEL CRÉDITO</strong> (monto, tasa, saldo).</label>
                        </div>
                        <div class="flex items-start">
                            <input type="checkbox" id="chk4-3" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk4-3" class="ml-3 block text-gray-700 cursor-pointer">Revisar <strong>TABLA AMORTIZACIÓN</strong>: 1er corte debe ser 1 día después de la reestructuración.</label>
                        </div>
                        <div class="flex items-start">
                            <input type="checkbox" id="chk4-4" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="chk4-4" class="ml-3 block text-gray-700 cursor-pointer">Revisión Pagaré: Tasa autorizada, fechas de corte/vencimiento, y plazo total.</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PASO 5 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <button class="accordion-header w-full flex justify-between items-center p-5 bg-gray-50 hover:bg-gray-100 transition-colors focus:outline-none" onclick="toggleAccordion('step5')">
                    <div class="flex items-center">
                        <span class="bg-corporate-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3">5</span>
                        <h3 class="text-lg font-semibold text-gray-800">Cierre, Control y Entrega</h3>
                    </div>
                    <i id="icon-step5" class="fas fa-chevron-down text-gray-400 transition-transform duration-300"></i>
                </button>
                <div id="step5" class="accordion-content">
                    <div class="p-5 border-t border-gray-200">
                        <div class="space-y-3 mb-6">
                            <div class="flex items-start">
                                <input type="checkbox" id="chk5-1" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <label for="chk5-1" class="ml-3 block text-gray-700 cursor-pointer">Dar por liquidado/matado el crédito anterior.</label>
                            </div>
                            <div class="flex items-start">
                                <input type="checkbox" id="chk5-2" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <label for="chk5-2" class="ml-3 block text-gray-700 cursor-pointer">Ensamblar expediente (recibos, hoja original, anexos).</label>
                            </div>
                            <div class="flex items-start">
                                <input type="checkbox" id="chk5-3" class="step-checkbox mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <label for="chk5-3" class="ml-3 block text-gray-700 cursor-pointer">Distribución: Original a Vianey, 1ª Copia Archivo Gral, 2ª Copia Archivo Interno.</label>
                            </div>
                        </div>

                        <!-- Status Report Generator -->
                        <div class="bg-corporate-50 border border-corporate-100 rounded-lg p-5 shadow-sm">
                            <h4 class="text-md font-semibold text-corporate-700 mb-4 border-b border-corporate-100 pb-2"><i class="fas fa-clipboard-list mr-2"></i>Generador de Reporte / Ticket</h4>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Estatus del Trámite</label>
                                    <select id="report-status" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-blue-500 focus:border-blue-500" onchange="generateReport()">
                                        <option value="Éxito">Procesado con Éxito</option>
                                        <option value="Error">Error / En Tránsito</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Núm. de Crédito (Nuevo / Anterior)</label>
                                    <input type="text" id="report-credit" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Ej. 123456" oninput="generateReport()">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones / Descripción del Error</label>
                                <textarea id="report-notes" rows="2" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Detalle adicional o mensaje para el ticket..." oninput="generateReport()"></textarea>
                            </div>

                            <div class="relative">
                                <textarea id="report-output" rows="4" class="w-full bg-white rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-600 font-mono" readonly></textarea>
                                <button onclick="copyToClipboard()" class="absolute right-2 bottom-2 bg-corporate-600 hover:bg-corporate-700 text-white text-xs px-3 py-1.5 rounded transition-colors shadow">
                                    <i class="fas fa-copy mr-1"></i> Copiar
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast"><i class="fas fa-check-circle mr-2 text-green-400"></i>Copiado al portapapeles</div>

    <script>
        // Accordion Logic
        function toggleAccordion(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                // Close all others (optional, keeps UI clean)
                document.querySelectorAll('.accordion-content').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.fa-chevron-down').forEach(el => el.style.transform = 'rotate(0deg)');
                
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        // Default open the first section
        document.addEventListener('DOMContentLoaded', () => {
            toggleAccordion('step1');
            generateReport(); // Initialize report box
        });

        // Progress Bar Logic
        const checkboxes = document.querySelectorAll('.step-checkbox');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        checkboxes.forEach(box => {
            box.addEventListener('change', updateProgress);
        });

        function updateProgress() {
            const total = checkboxes.length;
            const checked = document.querySelectorAll('.step-checkbox:checked').length;
            const percentage = Math.round((checked / total) * 100);
            
            progressBar.style.width = percentage + '%';
            progressText.innerText = percentage + '% Completado';
            
            if(percentage === 100) {
                progressBar.classList.remove('bg-blue-600');
                progressBar.classList.add('bg-green-500');
            } else {
                progressBar.classList.add('bg-blue-600');
                progressBar.classList.remove('bg-green-500');
            }
        }

        // Calculator Logic
        function calculateQuita() {
            const saldoTotal = parseFloat(document.getElementById('calc-saldo').value) || 0;
            const montoReestructurar = parseFloat(document.getElementById('calc-reest').value) || 0;
            
            const quita = saldoTotal - montoReestructurar;
            
            const resultInput = document.getElementById('calc-result');
            // Format to 2 decimal places
            resultInput.value = quita.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
        }

        // Report Generator Logic
        function generateReport() {
            const status = document.getElementById('report-status').value;
            const credit = document.getElementById('report-credit').value || '[No especificado]';
            const notes = document.getElementById('report-notes').value || 'Ninguna.';
            const date = new Date().toLocaleDateString('es-MX');

            let reportText = `--- REPORTE DE REESTRUCTURACIÓN ---\n`;
            reportText += `Fecha: ${date}\n`;
            reportText += `Crédito: ${credit}\n`;
            reportText += `Estatus: ${status}\n`;
            reportText += `Observaciones: ${notes}\n`;
            
            if (status === 'Error') {
                reportText += `\n>> FAVOR DE REVISAR TICKET / SISTEMA <<`;
            } else {
                reportText += `\n>> EXPEDIENTE COMPLETADO Y ENTREGADO <<`;
            }

            document.getElementById('report-output').value = reportText;
        }

        // Copy to Clipboard (using execCommand for iframe compatibility as requested)
        function copyToClipboard() {
            const copyText = document.getElementById('report-output');
            copyText.select();
            copyText.setSelectionRange(0, 99999); // For mobile devices
            
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
            
            // Clear selection
            window.getSelection().removeAllRanges();
        }

        // Toast display
        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }
    </script>
</body>
</html>
