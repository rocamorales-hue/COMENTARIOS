<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Textos Estructurado</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 { margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover { background-color: var(--primary-hover); }

        .result-box {
            width: 100%;
            height: 250px;
            margin-top: 15px;
            background: #f1f5f9;
            border: 1px dashed var(--border);
            padding: 15px;
            border-radius: 6px;
            box-sizing: border-box;
            font-weight: 500;
            text-transform: uppercase;
            overflow-y: auto;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div style="max-width: 1000px; width: 100%;">
    <center><h1>Generador de Dictámenes e Informes</h1></center>

    <div class="container">
        <div class="card">
            <h2>Datos del Solicitante</h2>
            <form id="dataForm" onsubmit="return false;">
                <div class="form-group">
                    <label>NOMBRE</label>
                    <input type="text" id="nombre" placeholder="Ej. JUAN PÉREZ">
                </div>
                
                <div class="grid-inputs">
                    <div class="form-group">
                        <label>EDAD</label>
                        <input type="text" id="edad" placeholder="Ej. 35 AÑOS">
                    </div>
                    <div class="form-group">
                        <label>ESTADO CIVIL</label>
                        <input type="text" id="estadoCivil" placeholder="Ej. CASADO">
                    </div>
                </div>

                <div class="form-group">
                    <label>UBICACIÓN DEL NEGOCIO</label>
                    <input type="text" id="ubicacion" placeholder="Ej. HERMOSILLO, SONORA">
                </div>

                <div class="form-group">
                    <label>ACTIVIDAD / GIRO</label>
                    <input type="text" id="actividad" placeholder="Ej. COMERCIALIZACIÓN DE CAFÉ">
                </div>

                <div class="grid-inputs">
                    <div class="form-group">
                        <label>ANTIGÜEDAD NEGOCIO</label>
                        <input type="text" id="antiguedad" placeholder="Ej. 3 AÑOS">
                    </div>
                    <div class="form-group">
                        <label>EXPERIENCIA EN EL GIRO</label>
                        <input type="text" id="experiencia" placeholder="Ej. 5 AÑOS">
                    </div>
                </div>

                <div class="form-group">
                    <label>MONTO FINANCIAMIENTO</label>
                    <input type="text" id="monto" placeholder="Ej. $150,000.00 MXN">
                </div>

                <div class="form-group">
                    <label>FINANCIAMIENTO PARA (DESTINO)</label>
                    <textarea id="destino" rows="2" placeholder="Ej. COMPRA DE MERCANCÍA Y MATERIA PRIMA PARA OPERACIÓN"></textarea>
                </div>

                <button type="button" id="btnGenerar">Generar Texto Continuo</button>
            </form>
        </div>

        <div class="card" style="display: flex; flex-direction: column;">
            <h2>Texto Estructurado</h2>
            <p style="font-size: 0.9rem; color: #64748b; margin: 0;">El informe ejecutivo se redactará en un solo párrafo y completamente en letras mayúsculas.</p>
            
            <div id="resultado" class="result-box">El dictamen final aparecerá aquí...</div>
            
            <button id="btnCopiar" style="background-color: #10b981;">Copiar Texto</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('btnGenerar').addEventListener('click', () => {
        // Campos a validar
        const campos = ['nombre', 'edad', 'estadoCivil', 'ubicacion', 'actividad', 'antiguedad', 'experiencia', 'monto', 'destino'];
        for (let id of campos) {
            if (!document.getElementById(id).value.trim()) {
                alert('Por favor, llene todos los campos para estructurar el dictamen.');
                return;
            }
        }

        // Obtener valores y limpiar espacios
        const nombre = document.getElementById('nombre').value.trim();
        const edad = document.getElementById('edad').value.trim();
        const estadoCivil = document.getElementById('estadoCivil').value.trim();
        const ubicacion = document.getElementById('ubicacion').value.trim();
        const actividad = document.getElementById('actividad').value.trim();
        const antiguedad = document.getElementById('antiguedad').value.trim();
        const experiencia = document.getElementById('experiencia').value.trim();
        const monto = document.getElementById('monto').value.trim();
        const destino = document.getElementById('destino').value.trim();

        // Estructura de redacción profesional continua
        let parrafoFinal = `EL SOLICITANTE ${nombre}, DE ${edad} DE EDAD Y ESTADO CIVIL ${estadoCivil}, CUENTA CON UN NEGOCIO CON UBICACIÓN EN ${ubicacion} DEDICADO A LA ACTIVIDAD DE ${actividad}. DICHO ESTABLECIMIENTO REGISTRA UNA ANTIGÜEDAD DE ${antiguedad} Y EL TITULAR ACREDITA UNA EXPERIENCIA EN EL GIRO DE ${experiencia}. ASIMISMO, SE SOLICITA UN MONTO DE FINANCIAMIENTO POR LA CANTIDAD DE ${monto}, EL CUAL SERÁ DESTINADO ESTRICTAMENTE PARA LA INVERSIÓN EN ${destino}. REVISADO EL EXPEDIENTE SE DETERMINA QUE LOS DATOS COINCIDEN CON LOS REQUISITOS ESTABLECIDOS.`;

        // Asegurar formato estricto: mayúsculas y un solo párrafo continuo
        parrafoFinal = parrafoFinal.toUpperCase().replace(/\s+/g, ' ');

        // Pintar en el panel derecho
        document.getElementById('resultado').innerText = parrafoFinal;
    });

    // Función del botón Copiar
    document.getElementById('btnCopiar').addEventListener('click', () => {
        const texto = document.getElementById('resultado').innerText;
        if(texto && !texto.includes("El dictamen final aparecerá aquí")) {
            navigator.clipboard.writeText(texto);
            alert("¡Texto copiado al portapapeles!");
        }
    });
</script>

</body>
</html>
